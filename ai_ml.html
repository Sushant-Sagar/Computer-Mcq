<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .question-card {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e0e0e0;
        }
        .question-text {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 10px;
            color: #333;
        }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn {
            background-color: #e9ecef;
            border: 2px solid #ced4da;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            text-align: left;
            font-size: 0.95em;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .btn:hover {
            background-color: #dee2e6;
        }
        .btn.correct {
            background-color: #28a745 !important;
            color: white;
            border-color: #28a745 !important;
        }
        .btn.incorrect {
            background-color: #dc3545 !important;
            color: white;
            border-color: #dc3545 !important;
        }
        .explanation {
            margin-top: 10px;
            padding: 10px;
            background-color: #e8f4f8;
            border-left: 4px solid #17a2b8;
            display: none;
            font-size: 0.9em;
            color: #2c3e50;
        }
    </style>
</head>

</div>

function renderQuiz() {
    const quizContainer = document.getElementById('quiz');
    quizData.forEach((item, index) => {
        const qCard = document.createElement('div');
        qCard.className = 'question-card';

        const qTitle = document.createElement('div');
        qTitle.className = 'question-text';
        qTitle.innerText = item.q;
        qCard.appendChild(qTitle);

        const optionsContainer = document.createElement('div');
        optionsContainer.className = 'options';

        item.options.forEach((opt, optIdx) => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = (optIdx + 1) + ") " + opt;
            btn.onclick = () => checkAnswer(btn, index, optIdx);
            optionsContainer.appendChild(btn);
        });

        qCard.appendChild(optionsContainer);

        const expDiv = document.createElement('div');
        expDiv.id = `exp-${index}`;
        expDiv.className = 'explanation';
        expDiv.innerHTML = `<strong>Explanation:</strong> ${item.exp}`;
        qCard.appendChild(expDiv);

        quizContainer.appendChild(qCard);
    });
}

function checkAnswer(selectedBtn, qIndex, selectedIdx) {
    const card = selectedBtn.closest('.question-card');
    const buttons = card.querySelectorAll('.btn');
    const correctIdx = quizData[qIndex].ans;

    buttons.forEach((btn, idx) => {
        btn.disabled = true; // Disable buttons after click
        if (idx === correctIdx) {
            btn.classList.add('correct');
        }
    });

    if (selectedIdx !== correctIdx) {
        selectedBtn.classList.add('incorrect');
    }

    const expDiv = document.getElementById(`exp-${qIndex}`);
    expDiv.style.display = 'block';
}

window.onload = renderQuiz;

</body>
</html>
