// Helper function to shuffle array elements (Fisher-Yates Shuffle algorithm)
function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function renderQuiz() {
    const container = document.getElementById('quiz-container');
    
    quizData.forEach((item, qIndex) => {
        const qCard = document.createElement('div');
        qCard.className = 'question-card';

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.innerText = item.q;
        qCard.appendChild(qText);

        // Prepare option objects so we track original index for verification
        let optionsObj = item.options.map((opt, index) => {
            return { text: opt, originalIndex: index };
        });

        // Shuffle options on each page load
        let shuffledOptions = shuffleArray(optionsObj);

        const optsList = document.createElement('div');
        optsList.className = 'options-list';

        const expBox = document.createElement('div');
        expBox.className = 'explanation';
        expBox.innerText = `Explanation: ${item.explanation}`;

        shuffledOptions.forEach((optObj) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = optObj.text;

            btn.onclick = function() {
                // Disable all option buttons for this question once answered
                const siblings = optsList.querySelectorAll('.option-btn');
                siblings.forEach(b => b.disabled = true);

                if (optObj.originalIndex === item.answer) {
                    btn.classList.add('correct');
                } else {
                    btn.classList.add('wrong');
                    // Highlight the correct option in green
                    siblings.forEach(b => {
                        if (b.innerText === item.options[item.answer]) {
                            b.classList.add('correct');
                        }
                    });
                }
                expBox.style.display = 'block';
            };

            optsList.appendChild(btn);
        });

        qCard.appendChild(optsList);
        qCard.appendChild(expBox);
        container.appendChild(qCard);
    });
}
