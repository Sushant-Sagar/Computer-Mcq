    // Fisher-Yates Shuffle Algorithm
    function shuffleArray(array) {
      let shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    const quizListContainer = document.getElementById('quiz-list');

    // Render Quiz Items
    quizData.forEach((item, qIndex) => {
      const card = document.createElement('div');
      card.className = 'question-card';

      const title = document.createElement('div');
      title.className = 'question-title';
      title.innerText = item.q;
      card.appendChild(title);

      const optionsContainer = document.createElement('div');
      optionsContainer.className = 'options-container';

      // Create option objects with index tracking
      let optionObjects = item.options.map((optText, originalIdx) => {
        return {
          text: optText,
          isCorrect: originalIdx === item.correctIndex
        };
      });

      // Shuffle options on page reload
      optionObjects = shuffleArray(optionObjects);

      const expBox = document.createElement('div');
      expBox.className = 'explanation';
      expBox.innerHTML = `<strong>Explanation:</strong> ${item.exp}`;

      optionObjects.forEach((optObj) => {
        const btn = document.createElement('a');
        btn.href = "javascript:void(0);";
        btn.className = 'option-btn';
        btn.innerText = optObj.text;

        btn.addEventListener('click', function() {
          const allButtons = optionsContainer.querySelectorAll('.option-btn');
          
          // Disable all buttons in this question card
          allButtons.forEach(b => b.classList.add('disabled'));

          if (optObj.isCorrect) {
            btn.classList.add('correct');
          } else {
            btn.classList.add('wrong');
            // Highlight the right option in green
            allButtons.forEach((b, idx) => {
              if (optionObjects[idx].isCorrect) {
                b.classList.add('correct');
              }
            });
          }

          // Show explanation
          expBox.style.display = 'block';
        });

        optionsContainer.appendChild(btn);
      });

      card.appendChild(optionsContainer);
      card.appendChild(expBox);
      quizListContainer.appendChild(card);
    });
