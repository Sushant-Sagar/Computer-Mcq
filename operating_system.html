    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    const container = document.getElementById('quiz-container');

    questions.forEach((q, qIndex) => {
        const shuffledOptions = shuffle([...q.options]);

        const card = document.createElement('div');
        card.className = 'question-card';

        const title = document.createElement('div');
        title.className = 'question-title';
        title.innerText = q.question;
        card.appendChild(title);

        const optionsList = document.createElement('ul');
        optionsList.className = 'options-list';

        const explanationDiv = document.createElement('div');
        explanationDiv.className = 'explanation';
        explanationDiv.innerText = q.explanation;

        shuffledOptions.forEach(opt => {
            const li = document.createElement('li');
            const link = document.createElement('a');
            link.className = 'option-link';
            link.href = 'javascript:void(0);';
            link.innerText = opt.text;

            link.onclick = function() {
                const allLinks = optionsList.querySelectorAll('.option-link');
                allLinks.forEach(l => l.style.pointerEvents = 'none');

                if (opt.correct) {
                    link.classList.add('correct');
                } else {
                    link.classList.add('incorrect');
                    allLinks.forEach(l => {
                        const originalOpt = q.options.find(o => o.text === l.innerText);
                        if (originalOpt && originalOpt.correct) {
                            l.classList.add('correct');
                        }
                    });
                }
                explanationDiv.style.display = 'block';
            };

            li.appendChild(link);
            optionsList.appendChild(li);
        });

        card.appendChild(optionsList);
        card.appendChild(explanationDiv);
        container.appendChild(card);
    });
