// Utility function to shuffle an array (Fisher-Yates Shuffle)
function shuffleArray(array) {
    let curId = array.length;
    while (0 !== curId) {
        let randId = Math.floor(Math.random() * curId);
        curId -= 1;
        let tmp = array[curId];
        array[curId] = array[randId];
        array[randId] = tmp;
    }
    return array;
}

        title.className = 'question-title';
        title.innerText = item.q;
        qCard.appendChild(title);

        // Map options with their original index to preserve correct answer after shuffle
        let mappedOptions = item.options.map((optText, origIndex) => {
            return { text: optText, originalIndex: origIndex };
        });

        // Shuffle options on reload
        mappedOptions = shuffleArray(mappedOptions);

        const optionsList = document.createElement('div');
        optionsList.className = 'options-list';

        const explanationDiv = document.createElement('div');
        explanationDiv.className = 'explanation';
        explanationDiv.innerHTML = `<strong>Explanation:</strong> ${item.explanation}`;

        mappedOptions.forEach((optObj, displayIdx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = `${displayIdx + 1}) ${optObj.text}`;

            btn.onclick = function() {
                const allButtons = optionsList.querySelectorAll('.option-btn');
                allButtons.forEach(b => b.disabled = true);

                if (optObj.originalIndex === item.correctIndex) {
                    btn.classList.add('correct');
                } else {
                    btn.classList.add('incorrect');
                    // Highlight the correct option
                    mappedOptions.forEach((o, idx) => {
                        if (o.originalIndex === item.correctIndex) {
                            allButtons[idx].classList.add('correct');
                        }
                    });
                }
                explanationDiv.style.display = 'block';
            };

            optionsList.appendChild(btn);
        });

        qCard.appendChild(optionsList);
        qCard.appendChild(explanationDiv);
        quizContainer.appendChild(qCard);
    });
}

// Execute on load
window.onload = renderQuiz;
</script>

</body>
</html>
