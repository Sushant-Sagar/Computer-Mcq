<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptography Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 20px;
            padding: 0;
            color: #333;
        }
        .quiz-container {
            max-width: 900px;
            margin: auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        .question-card {
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 18px;
            margin-bottom: 20px;
            background-color: #fafafa;
        }
        .question-title {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 12px;
            color: #1a252f;
        }
        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .option-item {
            margin-bottom: 8px;
        }
        .option-link {
            display: block;
            padding: 10px 14px;
            background-color: #ffffff;
            border: 1px solid #cccccc;
            border-radius: 4px;
            color: #333;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }
        .option-link:hover {
            background-color: #eef2f7;
        }
        .option-link.correct {
            background-color: #28a745 !important;
            color: #ffffff !important;
            border-color: #28a745 !important;
            font-weight: bold;
        }
        .option-link.incorrect {
            background-color: #dc3545 !important;
            color: #ffffff !important;
            border-color: #dc3545 !important;
        }
        .explanation {
            display: none;
            margin-top: 12px;
            padding: 12px;
            background-color: #eef7fc;
            border-left: 4px solid #17a2b8;
            font-size: 0.95em;
            color: #1c3d5a;
            border-radius: 0 4px 4px 0;
        }
        .disabled {
            pointer-events: none;
            opacity: 0.85;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>Cryptography Practice Quiz</h1>
    <div id="quiz-body"></div>
</div>

<script>
const rawQuestions = [
    {
        q: "Q.1. RSA algorithm is best example of.?",
        options: ["asymmetric key cryptography", "Symmetric key cryptography", "elliptic curve cryptography", "More than one of the above", "All of the above"],
        correct: 0,
        exp: "RSA is an asymmetric key cryptographic algorithm that utilizes a public key for encryption and a private key for decryption."
    },
    {
        q: "Q.2. It is the message after transformation ?",
        options: ["Cipher text", "Plaintext", "Secret-text", "More than one of the above", "None of the above"],
        correct: 0,
        exp: "Ciphertext is the unreadable output produced after applying an encryption algorithm to readable plaintext."
    },
    {
        q: "Q.3. An algorithm transforms plaintext to cipher text ?",
        options: ["Encryption", "Decryption", "Translation", "All of these", "None of the above"],
        correct: 0,
        exp: "Encryption is the process or algorithm used to convert plain readable text into encrypted ciphertext."
    },
    {
        q: "Q.4. An algorithm transforms cipher text to plain text ?",
        options: ["Encryption", "Decryption", "Translation", "All of these", "None of the above"],
        correct: 1,
        exp: "Decryption is the reverse process of converting encrypted ciphertext back into its original readable plaintext format."
    },
    {
        q: "Q.5. In _______Cipher, the same key is used by both the sender and receiver?",
        options: ["Symmetric Key", "Asymmetric Key", "Parallel Key", "All of these", "None of the above"],
        correct: 0,
        exp: "Symmetric key cryptography uses a single shared secret key for both encryption and decryption."
    },
    {
        q: "Q.6. Cryptography, a word with Greek origins, means?",
        options: ["Corrupting Data", "Secret Writing", "Open Writing", "Closed Writing", "None of these"],
        correct: 1,
        exp: "The word Cryptography originates from the Greek words 'kryptos' (hidden/secret) and 'graphein' (writing)."
    },
    {
        q: "Q.7. Hide Information Inside A Picture, What Technology Is Used.?",
        options: ["Rootkits", "Bitmapping", "Steganography", "Image Rendering", "All of these"],
        correct: 2,
        exp: "Steganography is the technique of hiding secret information within ordinary files, such as images or media."
    },
    {
        q: "Q.8. Data Encryption Standard was designed by.?",
        options: ["Intel", "IBM", "HP", "Sony", "None of these"],
        correct: 1,
        exp: "Data Encryption Standard (DES) was originally designed by IBM in the early 1970s and later adopted as a standard."
    },
    {
        q: "Q.9. It is the process of converting data from a readable, plaintext format into an unreadable, encoded format called.?",
        options: ["SSL Security", "HTTPS", "Virtual Private Network", "Encryption", "Decryption"],
        correct: 3,
        exp: "Encryption encodes data so that it becomes unreadable to unauthorized users without the decryption key."
    },
    {
        q: "Q.10. Which of the following option is used to protect data and passwords.?",
        options: ["Authorization", "Authentication", "Encryption", "Non-repudiation", "Decryption"],
        correct: 2,
        exp: "Encryption protects data and passwords by turning sensitive information into secure ciphertext during storage and transit."
    },
    {
        q: "Q.11. It is a process that transforms encrypted information into its original format.?",
        options: ["Encryption", "Decryption", "Both of these", "Cipher Text", "1,2,4"],
        correct: 1,
        exp: "Decryption converts encrypted binary/ciphertext back into readable raw data."
    },
    {
        q: "Q.12. Among these which is/are major types of Encryption.?",
        options: ["DES", "AES", "RSA", "All of these", "None of these"],
        correct: 3,
        exp: "DES, AES, and RSA are all widely used standard encryption algorithms in modern computer security."
    },
    {
        q: "Q.13. An asymmetric-key cipher uses.?",
        options: ["1 Key", "2 Key", "3 Key", "4 Key", "Non of these"],
        correct: 1,
        exp: "Asymmetric key ciphers use a pair of 2 mathematically linked keys: a Public Key and a Private Key."
    },
    {
        q: "Q.14. Cryptography term is used to transforming messages to make them secure and to prevent from.?",
        options: ["Change", "Defend", "Idle", "Attacks", "All of these"],
        correct: 3,
        exp: "Cryptography aims to protect data from various security threats and malicious unauthorized attacks."
    },
    {
        q: "Q.15. Which one is the Heart of Data Encryption Standard (DES).?",
        options: ["DES function", "Encryption", "Rounds", "Cipher", "All of these"],
        correct: 0,

    },
    {
        q: "Q.16. DES stands for.?",
        options: ["Data Encryption Slots", "Data Encryption Subscription", "Data Encryption Standard", "Data Encryption Solutions", "None of these"],
        correct: 2,
        exp: "DES stands for Data Encryption Standard."
    },
    {
        q: "Q.17. Conventional cryptography also known as_______ encryption.?",
        options: ["asymmetric-key", "logical-key", "symmetric-key", "All of these", "None of these"],
        correct: 2,
        exp: "Conventional or traditional cryptography relies on a single shared key, also called symmetric-key encryption."
    },
    {
        q: "Q.18. Public key cryptography is a _______cryptosystem.?",
        options: ["Symmetric", "Asymmetric", "Symmetric & Asymmetric both", "Simple", "None of these"],
        correct: 1,
        exp: "Public key cryptography is inherently an asymmetric cryptosystem that uses different keys for encryption and decryption."
    },
    {
        q: "Q.19. Which is the cryptographic protocol that is used to protect an HTTP connection?",
        options: ["Resource reservation protocol", "SCTP", "TLS", "ECN", "FTP"],
        correct: 2,
        exp: "Transport Layer Security (TLS) encrypts web communications to secure standard HTTP connections (HTTPS)."
    },
    {
        q: "Q.20. The _______method provides a one- time session key for two parties.?",
        options: ["Diffie-Hellman", "RSA", "DES", "AES", "None of these"],
        correct: 0,
        exp: "The Diffie-Hellman key exchange algorithm allows two parties to establish a shared temporary session key over an insecure channel."
    },
    {
        q: "Q.21. Confidentiality can be achieved with?",
        options: ["Encryption", "Decryption", "Networking", "Compression", "None of these"],
        correct: 0,
        exp: "Encryption ensures data confidentiality by making readable information inaccessible to unauthorized entities."
    },
    {
        q: "Q.22. Name that person who attempts to break a cypher text message to obtain the original plaintext message?",
        options: ["Encryptalyst", "Cryptanalyst", "Decryptanalyst", "Hacker", "None of these"],
        correct: 1,
        exp: "A Cryptanalyst studies and analyzes encryption systems to decipher ciphertext without knowing the secret key."
    },
    {
        q: "Q.23. Asymmetric or public-key encryption systems use ?",
        options: ["Public Key", "Private Key", "Both of these", "Simple Key", "None of these"],
        correct: 2,
        exp: "Asymmetric systems rely on both a Public Key (for encryption) and a Private Key (for decryption)."
    },
    {
        q: "Q.24. One commonly used public-key cryptography method is the ________algorithm.?",
        options: ["RSS", "RAS", "RSA", "RAA", "None of these"],
        correct: 2,
        exp: "RSA (Rivest–Shamir–Adleman) is one of the most widely implemented public-key cryptographic algorithms."
    },
    {
        q: "Q.25. In an asymmetric-key cipher, the sender uses the _____ key.?",
        options: ["private", "public", "either (1) or (2)", "neither (1) nor (2)", "protected"],
        correct: 1,
        exp: "In public-key encryption, the sender encrypts the message using the receiver's public key."
    },
    {
        q: "Q.26. In an asymmetric-key cipher, the receiver uses the _____ key.?",

        correct: 0,
        exp: "The receiver uses their own private key to decrypt messages encrypted with their public key."
    },
    {
        q: "Q.27. In a(n) _____ cipher, a pair of keys is used.?",
        options: ["symmetric-key", "asymmetric-key", "either (1) or (2)", "neither (1) nor (2)", "Both 1 & 2"],
        correct: 1,
        exp: "An asymmetric-key cipher specifically utilizes a key pair consisting of a public and a private key."
    },
    {
        q: "Q.28. In a(n) _____ cipher, the key is called the secret key.?",
        options: ["symmetric-key", "asymmetric-key", "either (1) or (2)", "neither (1) nor (2)", "Both 1 & 2"],
        correct: 0,
        exp: "In symmetric-key ciphers, the single key must be kept completely secret between sender and receiver."
    },
    {
        q: "Q.29. In a(n) _____ cipher, the same key is used by both the sender and receiver.?",
        options: ["symmetric-key", "asymmetric-key", "either (1) or (2)", "neither (1) nor (2)", "Both 1 & 2"],
        correct: 0,
        exp: "Symmetric encryption uses identical keys for both encryption and decryption steps."
    },
    {
        q: "Q.30. The _____ is a number or a set of numbers on which the cipher operates.?",
        options: ["cipher", "secret", "Key", "id", "None of the above"],
        correct: 2,
        exp: "A Key is a parameter or numerical value that determines the transformation output of a cipher algorithm."
    },
    {
        q: "Q.31. In asymmetric key cryptography, the private key is kept by.?",
        options: ["sender", "receiver", "sender and receiver", "all the connected devices to the network", "None of these"],
        correct: 1,
        exp: "The private key must strictly be kept secret and held only by the receiver to decrypt messages."
    },
    {
        q: "Q.32. Among these which is not Symmetric Key Encryption Method.?",
        options: ["AES", "DES", "RC4", "RSA", "None of these"],
        correct: 3,
        exp: "RSA is an Asymmetric key encryption method, whereas AES, DES, and RC4 are Symmetric key algorithms."
    },
    {
        q: "Q.33. Among these which is not Asymmetric Key Encryption Method.?",
        options: ["RSA", "DSA", "Diffie-Hellman", "AES", "None of these"],
        correct: 3,
        exp: "AES (Advanced Encryption Standard) is a symmetric-key encryption algorithm."
    },
    {
        q: "Q.34. It is a mathematical algorithm routinely used to validate the authenticity and integrity of a message.?",
        options: ["Cryptography", "Digital Signature", "Hashing", "VPN", "None of these"],
        correct: 1,
        exp: "A Digital Signature verifies authenticity, non-repudiation, and message integrity using public-key cryptography."
    },
    {
        q: "Q.35. Example of Asymmetric Encryption are.?",
        options: ["HTTPS", "Bitcoin", "Digital Signature", "All of these", "None of these"],
        correct: 3,
        exp: "HTTPS, Bitcoin transactions, and Digital Signatures all rely heavily on asymmetric public-key cryptography."
    },
    {
        q: "Q.36. Example of Symmetric Encryption are.?",
        options: ["Card Transaction", "Hashing Function", "Bulk Encryption", "All of these", "None of these"],
        correct: 3,
        exp: "Symmetric encryption provides fast data processing needed for card transactions, hashing, and high-volume bulk encryption."
    },
    {
        q: "Q.37. This Encryption technique only provides Confidentiality.?",
        options: ["Symmetric Encryption", "Asymmetric Encryption", "Simple Encryption", "All of these", "None of these"],
        correct: 0,
        exp: "Symmetric encryption primarily ensures confidentiality since key possession alone does not guarantee message non-repudiation."
    },
    {
        q: "Q.38. It provides confidentiality, authenticity & non repudiation.?",
        options: ["Symmetric Encryption", "Asymmetric Encryption", "Asynchronous Encryption", "All of these", "None of these"],
        correct: 1,
        exp: "Asymmetric encryption provides confidentiality along with sender identity verification (authenticity and non-repudiation)."
    }
];

// Fisher-Yates Shuffle Algorithm to randomize options on page reload
function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex !== 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
}

function buildQuiz() {
    const quizContainer = document.getElementById('quiz-body');
    quizContainer.innerHTML = '';

    rawQuestions.forEach((item, qIndex) => {
        let optionsObj = item.options.map((optText, origIndex) => {
            return {
                text: optText,
                isCorrect: origIndex === item.correct
            };
        });

        // Shuffle options on page reload
        optionsObj = shuffle(optionsObj);

        const card = document.createElement('div');
        card.className = 'question-card';

        const qTitle = document.createElement('div');
        qTitle.className = 'question-title';
        qTitle.textContent = item.q;
        card.appendChild(qTitle);

        const optionsList = document.createElement('ul');
        optionsList.className = 'options-list';

        const expBox = document.createElement('div');
        expBox.className = 'explanation';
        expBox.id = `exp-${qIndex}`;
        expBox.innerHTML = `<strong>Explanation:</strong> ${item.exp}`;

        optionsObj.forEach((opt) => {
            const li = document.createElement('li');
            li.className = 'option-item';

            const link = document.createElement('a');
            link.href = 'javascript:void(0)';
            link.className = 'option-link';
            link.textContent = opt.text;

            link.onclick = function() {
                const allLinks = optionsList.querySelectorAll('.option-link');
                allLinks.forEach(l => l.classList.add('disabled'));

                if (opt.isCorrect) {
                    this.classList.add('correct');
                } else {
                    this.classList.add('incorrect');
                    allLinks.forEach(l => {
                        if (l.dataset.correct === "true") {
                            l.classList.add('correct');
                        }
                    });
                }
                expBox.style.display = 'block';
            };

            if (opt.isCorrect) {
                link.dataset.correct = "true";
            }

            li.appendChild(link);
            optionsList.appendChild(li);
        });

        card.appendChild(optionsList);
        card.appendChild(expBox);
        quizContainer.appendChild(card);
    });
}

window.onload = buildQuiz;
</script>

</body>
</html>
