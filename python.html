    // Fisher-Yates shuffle function
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function renderQuiz() {
        const quizContainer = document.getElementById('quiz-container');
        quizContainer.innerHTML = '';

        questionsData.forEach((qItem) => {
            // Shuffle all 5 options on page load
            let shuffledOptions = shuffleArray([...qItem.options]);

            const card = document.createElement('div');
            card.className = 'question-card';

            const title = document.createElement('div');
            title.className = 'question-title';
            title.innerText = qItem.q;
            card.appendChild(title);

            const ul = document.createElement('ul');
            ul.className = 'options-list';

            const explanationDiv = document.createElement('div');
            explanationDiv.className = 'explanation';
            explanationDiv.innerText = qItem.explanation;

            shuffledOptions.forEach((opt) => {
                const li = document.createElement('li');
                const link = document.createElement('a');
                link.className = 'option-link';
                link.innerText = opt.text;
                link.href = '#';

                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    
                    if (card.getAttribute('data-answered') === 'true') return;
                    card.setAttribute('data-answered', 'true');

                    const allLinks = ul.querySelectorAll('.option-link');
                    allLinks.forEach(l => {
                        const matchingOpt = shuffledOptions.find(o => o.text === l.innerText);
                        if (matchingOpt.correct) {
                            l.classList.add('correct');
                        }
                    });

                    if (!opt.correct) {
                        link.classList.add('incorrect');
                    }

                    explanationDiv.style.display = 'block';
                });

                li.appendChild(link);
                ul.appendChild(li);
            });

            card.appendChild(ul);
            card.appendChild(explanationDiv);
            quizContainer.appendChild(card);
        });
    }

    window.onload = renderQuiz;
