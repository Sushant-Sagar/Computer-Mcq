// Fisher-Yates Shuffle algorithm for options
function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function renderQuiz() {
    const container = document.getElementById('quiz-body');
    container.innerHTML = '';

    quizData.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'question-card';

        const qTitle = document.createElement('div');
        qTitle.className = 'question-title';
        qTitle.innerText = item.q;
        card.appendChild(qTitle);

        const optionsList = document.createElement('ul');
        optionsList.className = 'options-list';

        // Map options with their original index to verify correct answer after shuffle
        let optionsObj = item.options.map((optText, origIdx) => {
            return { text: optText, originalIndex: origIdx };
        });

        // Shuffle options dynamically on every page load/reload
        optionsObj = shuffleArray(optionsObj);

        optionsObj.forEach(optObj => {
            const li = document.createElement('li');
            const btn = document.createElement('a');
            btn.className = 'option-btn';
            btn.href = 'javascript:void(0);';
            btn.innerText = optObj.text;

            btn.onclick = function(e) {
                checkAnswer(card, e.target, optObj.originalIndex, item.correct);
            };

            li.appendChild(btn);
            optionsList.appendChild(li);
        });

        card.appendChild(optionsList);

        const expDiv = document.createElement('div');
        expDiv.className = 'explanation';
        expDiv.innerHTML = `<strong>Explanation:</strong> ${item.exp}`;
        card.appendChild(expDiv);

        container.appendChild(card);
    });
}

function checkAnswer(card, clickedBtn, selectedIdx, correctIdx) {
    const buttons = card.querySelectorAll('.option-btn');
    const expDiv = card.querySelector('.explanation');

    // Disable further clicks on this question
    buttons.forEach(btn => {
        btn.onclick = null;
        btn.style.cursor = 'default';
    });

    if (selectedIdx === correctIdx) {
        clickedBtn.classList.add('correct');
    } else {
        clickedBtn.classList.add('wrong');
    }

    expDiv.style.display = 'block';
}

window.onload = renderQuiz;
