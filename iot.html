// Fisher-Yates Shuffle Algorithm
function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function renderQuiz() {
    const container = document.getElementById('quiz-container');

    quizData.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';

        const qTitle = document.createElement('div');
        qTitle.className = 'question';
        qTitle.textContent = item.q;
        card.appendChild(qTitle);

        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options';

        // Create a copy of options array and shuffle it
        const shuffledOptions = shuffleArray([...item.options]);

        shuffledOptions.forEach((optionText) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = optionText;

            btn.onclick = () => {
                // Disable all options in this question once answered
                const siblings = optionsDiv.querySelectorAll('.option-btn');
                siblings.forEach(s => s.disabled = true);

                // Check correctness
                if (optionText === item.correct) {
                    btn.classList.add('correct');
                } else {
                    btn.classList.add('incorrect');
                    // Highlight the correct option in green
                    siblings.forEach(s => {
                        if (s.textContent === item.correct) {
                            s.classList.add('correct');
                        }
                    });
                }

                // Show Explanation
                const expBox = card.querySelector('.explanation');
                expBox.style.display = 'block';
            };

            optionsDiv.appendChild(btn);
        });

        card.appendChild(optionsDiv);

        // Explanation container
        const expDiv = document.createElement('div');
        expDiv.className = 'explanation';
        expDiv.innerHTML = `<strong>Explanation:</strong> ${item.exp}`;
        card.appendChild(expDiv);

        container.appendChild(card);
    });
}

// Initialize on page load
window.onload = renderQuiz;
