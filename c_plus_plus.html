// Fisher-Yates Shuffle Algorithm
function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex !== 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
}

function buildQuiz() {
    const quizContainer = document.getElementById('quiz-body');
    quizContainer.innerHTML = '';

    rawQuestions.forEach((item, qIndex) => {
        // Create map of original options with correctness indicator
        let optionsObj = item.options.map((optText, origIndex) => {
            return {
                text: optText,
                isCorrect: origIndex === item.correct
            };
        });

        // Shuffle options on each page load/refresh
        optionsObj = shuffle(optionsObj);

        // Build question markup
        const card = document.createElement('div');
        card.className = 'question-card';

        const qTitle = document.createElement('div');
        qTitle.className = 'question-title';
        qTitle.textContent = item.q;
        card.appendChild(qTitle);

        const optionsList = document.createElement('ul');
        optionsList.className = 'options-list';

        const expBox = document.createElement('div');
        expBox.className = 'explanation';
        expBox.id = `exp-${qIndex}`;
        expBox.innerHTML = `<strong>Explanation:</strong> ${item.exp}`;

        optionsObj.forEach((opt) => {
            const li = document.createElement('li');
            li.className = 'option-item';

            const link = document.createElement('a');
            link.href = 'javascript:void(0)';
            link.className = 'option-link';
            link.textContent = opt.text;

            link.onclick = function() {
                // Prevent multiple clicks for same question
                const allLinks = optionsList.querySelectorAll('.option-link');
                allLinks.forEach(l => l.classList.add('disabled'));

                if (opt.isCorrect) {
                    this.classList.add('correct');
                } else {
                    this.classList.add('incorrect');
                    // Highlight the right option in green
                    allLinks.forEach(l => {
                        if (l.dataset.correct === "true") {
                            l.classList.add('correct');
                        }
                    });
                }
                // Show explanation
                expBox.style.display = 'block';
            };

            if (opt.isCorrect) {
                link.dataset.correct = "true";
            }

            li.appendChild(link);
            optionsList.appendChild(li);
        });

        card.appendChild(optionsList);
        card.appendChild(expBox);
        quizContainer.appendChild(card);
    });
}

// Run quiz builder on page load
window.onload = buildQuiz;
