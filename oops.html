    // Function to shuffle array
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    const quizContainer = document.getElementById('quiz');

    quizDataforEach = quizData.forEach((item, index) => {
        // Shuffle options for each question on page reload
        let shuffledOptions = shuffle([...item.options]);

        const questionBox = document.createElement('div');
        questionBox.className = 'question-box';

        const questionTitle = document.createElement('div');
        questionTitle.className = 'question';
        questionTitle.innerText = item.q;
        questionBox.appendChild(questionTitle);

        const optionsList = document.createElement('ul');
        optionsList.className = 'options';

        const explanationDiv = document.createElement('div');
        explanationDiv.className = 'explanation';
        explanationDiv.innerText = item.exp;

        shuffledOptions.forEach(opt => {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.className = 'option-btn';
            a.href = "#";
            a.innerText = opt.text;

            a.onclick = function(e) {
                e.preventDefault();
                // Disable all options in this question after selection
                const allButtons = optionsList.getElementsByTagName('a');
                for (let btn of allButtons) {
                    btn.style.pointerEvents = 'none';
                }

                if (opt.correct) {
                    a.classList.add('correct');
                } else {
                    a.classList.add('incorrect');
                    // Highlight the correct one
                    for (let btn of allButtons) {
                        // Find original option matching correct
                        let matchedOpt = shuffledOptions.find(o => o.text === btn.innerText);
                        if (matchedOpt && matchedOpt.correct) {
                            btn.classList.add('correct');
                        }
                    }
                }
                explanationDiv.style.display = 'block';
            };

            li.appendChild(a);
            optionsList.appendChild(li);
        });

        questionBox.appendChild(optionsList);
        questionBox.appendChild(explanationDiv);
        quizContainer.appendChild(questionBox);
    });
</script>
